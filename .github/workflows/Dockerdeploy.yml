name: Docker Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Build Image
        run: docker build -t myapp .

      - name: Stop Old Container
        run: docker rm -f mycontainer || true

      - name: Run Container
        run: docker run -d -p 8081:80 --name mycontainer myapp
