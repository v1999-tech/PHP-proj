name: CI-CD Pipeline     #name of the pipeline

on:
  push:                  #runs when you push code
    branches:
      - master           #only triggers if code is pushed to master branch

jobs:
  build:                 #defines a job name build (pipeline can have multiple jobs)
    runs-on: self-hosted    #pipeline runs on your own server/machine

    steps:                #tasks  start executing one by one
      - name: Checkout Code    #downnload github repo code into runner
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.run_number }} ./website

      - name: Tag Latest Image
        run: docker tag ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/myapp:latest

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest

      - name: Run New Container
        run: docker run -d -p 8081:80 --name mycontainer vijetavernekar/myapp:latest
        
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/myapp:latest'

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
