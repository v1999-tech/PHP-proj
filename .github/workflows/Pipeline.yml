name: CI-CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest   # change to self-hosted only if needed

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Show Files
      run: ls -la

    # ✅ Build Docker Image
    - name: Build Docker Image
      run: docker build -t myapp:${{ github.run_number }} ./website

    # ✅ Scan Image (Trivy)
    - name: Scan Docker Image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: myapp:${{ github.run_number }}

    # ✅ Tag Image for Docker Hub
    - name: Tag Image
      run: docker tag myapp:${{ github.run_number }} vijetavernekar/myapp:latest

    # ✅ Login to Docker Hub
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # ✅ Push Image to Docker Hub
    - name: Push Image
      run: docker push vijetavernekar/myapp:latest

    # ✅ (Optional) Run container locally
    - name: Stop Old Container
      run: docker rm -f mycontainer || true

    - name: Run New Container
      run: docker run -d -p 8081:80 --name mycontainer vijetavernekar/myapp:latest

    # ✅ Deploy to Kubernetes
    - name: Deploy to Kubernetes
      run: |
        export KUBECONFIG=$HOME/.kube/config
        kubectl config use-context minikube
        kubectl cluster-info
        kubectl get nodes
        kubectl apply -f k8s/deployment.yml
        kubectl apply -f k8s/service.yml
